<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Repo en GitHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d1117, #161b22, #1a1e24);
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        p { color: #8b949e; line-height: 1.6; margin-bottom: 0.5rem; }
        .author { color: #58a6ff; font-weight: bold; margin-top: 1rem; }
        .badge {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚀</div>
        <h1>¡Hola GitHub!</h1>
        <p>Este es mi primer repositorio creado desde la terminal.</p>
        <p>Estoy aprendiendo Git y GitHub paso a paso.</p>
        <div class="author">@emilioarroyoval-debug</div>
        <div class="badge">✅ Mi primer commit</div>
    </div>
</body>
</html>
